name: Build Windows EXE (XR806)
on:
  push:
    branches: ["xr806"]
  workflow_dispatch:
jobs:
  build-win32:
    name: Build Win32 GUI and CLI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout LT repository
        uses: actions/checkout@v4
        with:
          repository: kuba2k2/libretiny
          path: libretiny

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ltchiptool, plugins and PyInstaller
        shell: cmd
        run: |
          python -m pip install --upgrade pip || exit /b
          python -m pip install .[gui] || exit /b
          python -m pip install "ltchiptool-terminal>=1.4.0" "upk2esphome>=1.15.0" pyinstaller || exit /b
          python -m pip check || exit /b

      - name: Copy LT data snapshot
        shell: cmd
        run: |
          mkdir ltchiptool\boards\_base
          copy libretiny\platform.json ltchiptool\
          copy libretiny\families.json ltchiptool\
          copy libretiny\boards\*.json ltchiptool\boards\
          xcopy /S libretiny\boards\_base ltchiptool\boards\

      - name: Build GUI with PyInstaller
        shell: cmd
        run: python gui-win32.py || exit /b

      - name: Build CLI with PyInstaller
        shell: cmd
        run: python -m PyInstaller cli-win32.spec || exit /b

      - name: Check the CLI build
        shell: cmd
        run: |
          dist\ltchiptool-cli.exe list families || exit /b
          dist\ltchiptool-cli.exe soc xr806kv --help || exit /b
          dist\ltchiptool-cli.exe soc xr806tool --help || exit /b

      - name: Upload EXE files
        uses: actions/upload-artifact@v4
        with:
          name: ltchiptool-xr806-win
          path: dist/*.exe
